name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is plain static files at the repository root: the page, its
      # stylesheet and scripts, three.js (vendor/), the media it loads, the
      # legal page, and the crawl files (robots.txt, sitemap.xml, 404.html,
      # icons). Everything at the root is deployed except the repository's
      # own files and the archived old site (archive/).
      - name: assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude='/.gitignore' \
            --exclude='/archive' --exclude='/_site' --exclude='.DS_Store' \
            ./ _site/
          for f in index.html rooms.css rooms.js rooms3d.js CNAME favicon.svg \
                   robots.txt sitemap.xml 404.html impressum.html \
                   vendor/three-0.160.0/build/three.module.min.js; do
            test -f "_site/$f" || { echo "missing in _site: $f"; exit 1; }
          done
          du -sh _site
          find _site -maxdepth 2 | sort | head -60

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
